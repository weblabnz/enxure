name: CI

on:
  push:
  pull_request:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: php -l across src/
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace php:8.3-cli \
            sh -c 'find src -name "*.php" -print0 | xargs -0 -r -n1 php -l'

  test-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Run Test Suite against enxure-test
        run: |
          resp=$(curl -sf -X POST --data "action=run_test_suite&cron_key=${{ secrets.TEST_CRON_SECRET }}" http://enxure-test-nginx/enxure.php)
          echo "$resp"
          failed=$(echo "$resp" | grep -oP '"failed":\K[0-9]+')
          [ "$failed" = "0" ]
