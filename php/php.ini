; Errors go to the container's stderr (`docker compose logs php`), not the
; browser.
display_errors = Off
log_errors = On
error_reporting = E_ALL
error_log = /proc/self/fd/2

; Sized for importing a database backup via Settings > Backup & Restore.
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
max_execution_time = 120
