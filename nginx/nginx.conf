user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index invoxa.php;

        # Never served directly: backups are full DB dumps, and lib/sql contain
        # application and license source. Backups are only accessible through
        # the authenticated app.
        location ~ ^/(lib|sql|invoxa-backups)/ {
            deny all;
            return 404;
        }

        # Docs are rendered in-app by invoxa.php (?doc=readme/install); the raw
        # files must never be served directly.
        location ~ ^/docs/ {
            deny all;
            return 404;
        }

        # A missing invoice/quote file must 404, not fall through to the app
        # (the generic location / below does that for clean-URL routing, which
        # would otherwise load the whole app inside an invoice preview iframe).
        location /invoxa-invoices/ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /invoxa.php?$query_string;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass php:9000;
            fastcgi_index invoxa.php;
            fastcgi_param SCRIPT_FILENAME /usr/share/nginx/html$fastcgi_script_name;
        }
    }
}
