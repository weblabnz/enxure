# Runs a public-facing demo of Invoxa alongside the base file, isolated from
# any production instance on the same host (separate project name, container
# names, and port):
#   HTTP_PORT=18091 docker compose -p invoxa-demo -f docker-compose.yml -f docker-compose.demo.yml up -d --build

services:
  db:
    container_name: invoxa-demo-db

  php:
    container_name: invoxa-demo-php
    environment:
      INVOXA_DEMO_MODE: "1"
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_ENCRYPTION: none
      SMTP_USER: demo
      SMTP_PASSWORD: demo
      SMTP_FROM_EMAIL: demo@invoxa.local
      SMTP_FROM_NAME: Invoxa Demo

  nginx:
    container_name: invoxa-demo-nginx

  cron:
    container_name: invoxa-demo-cron

  mailpit:
    image: axllent/mailpit:latest
    container_name: invoxa-demo-mailpit
    restart: unless-stopped
    networks:
      - invoxa-net
    labels:
      wud.watch: "false"
